# JARVIS configuration. Edit and restart, or hot-reload from the dashboard.

[identity]
name = "JARVIS"
# How JARVIS addresses you. Classic JARVIS uses "sir".
honorific = "sir"

[voice]
enabled = true
# provider: "auto" uses ElevenLabs when a key + voice_id are set, else free
# edge-tts. Force with "elevenlabs" or "edge".
provider = "auto"
# --- edge-tts (free, no key). en-GB-RyanNeural = calm British male (very JARVIS).
# Alternatives: en-GB-ThomasNeural, en-US-GuyNeural, en-AU-WilliamNeural
voice = "en-GB-RyanNeural"
rate = "-4%"     # slightly slower = more deliberate
pitch = "-2Hz"
greet_on_start = true
# --- ElevenLabs (needs ELEVENLABS_API_KEY in .env). Paste a voice_id to switch
# JARVIS to an ElevenLabs voice; leave blank to stay on edge-tts. ---
elevenlabs_voice_id = "onwK4e9ZLuTAKqWW03F9"  # Daniel — steady British broadcaster
elevenlabs_model = "eleven_turbo_v2_5"
elevenlabs_stability = 0.4
elevenlabs_similarity = 0.75

[ears]
# Speech-to-text for the mic button. Runs faster-whisper locally on CPU — your
# voice never leaves this machine. Model auto-downloads to data/whisper once.
# "base.en" = fast English; "small.en" = more accurate; for French/auto-detect
# use a multilingual model ("base"/"small") and set language = "".
enabled = true
model = "base.en"
language = "en"
compute_type = "int8"

[brain]
enabled = true
# Engines are tried in this order; the first one that is actually ready answers,
# and if it fails before saying anything the next takes over:
#   claude-cli  your Claude subscription via the `claude` CLI (needs `claude auth login` once)
#   sdk         the Anthropic API (ANTHROPIC_API_KEY in .env)
#   hermes      any model Hermes can reach (prefers a local model already loaded)
#   local       an OpenAI-compatible server directly (LM Studio), for when Hermes is down
# The ⚙ panel in the HUD can put any engine first without editing this file.
chain = ["claude-cli", "sdk", "hermes", "local"]
mode = "cli"                      # legacy; only used when `chain` is absent
sdk_model = "claude-sonnet-5-5"   # Anthropic API path
cli_model = "sonnet"              # claude CLI path ("sonnet" = the latest Sonnet)
# hermes_provider = "lmstudio"    # pin the Hermes engine to a provider / model
# hermes_model = "qwen/qwen3.6-35b-a3b"
local_base_url = "http://127.0.0.1:1234/v1"
# local_model = "qwen/qwen3.6-35b-a3b"
timeout = 180                     # seconds before a stuck CLI answer is abandoned

[alerts]
# Which alerts JARVIS says out loud: "none", "critical" or "all". Every alert
# also appears in the bell panel; mute any one of them there for good.
speak = "critical"

[shield]
# Project snapshots (zip backups) taken from the Projects view.
# dir = 'C:\Users\markj\Documents\JARVIS Backups'
keep = 5              # snapshots kept per project
max_file_mb = 50      # bigger files are left out (and listed in _SNAPSHOT.txt)
max_total_mb = 2000   # a snapshot that would exceed this is abandoned
fresh_days = 7        # a snapshot newer than this counts as "covered"

[automations]
# Scheduled tasks shown under Systems → Automations: anything outside \Microsoft\
# whose command points into a project root (or names a project) is included.
# include = ["FanControl"]   # extra task names (substring match)
# exclude = []

[updates]
auto_check = true     # check winget / npm / uv in the background every few hours

# Your own launcher tiles (Overview → Apps, the command palette, "open X"):
# [[apps]]
# id = "notebook"
# name = "Research notebook"
# icon = "🧪"
# group = "Custom"
# path = 'C:\Users\markj\Documents\PythonProjects\Notebook'   # launched like a project
# port = 8899                                                 # optional: live status + app window

[obsidian]
vault = 'C:\Users\markj\Documents\Obsidian Vault'
# JARVIS writes a daily system snapshot here (folder created if missing).
log_folder = "JARVIS Logs"

[projects]
# JARVIS auto-discovers every project under these roots — create a new project
# in any of them and it appears in the HUD on the next refresh, no config needed.
roots = [
    'C:\Users\markj\Documents\PythonProjects',
    'C:\Users\markj\source\repos',
]

# Per-project overrides (keyed by folder name). Paths are relative to the project.
#   docs_path = where to draw supporting documents from (instead of the root)
#   run_path  = the sub-folder whose app the top-level "Run" button launches
#   launch    = clicking the project's node on the map opens this app directly
#               ("quantfin" / "quantflow") instead of the project detail modal
[projects.overrides.QuantFin]
docs_path = "trading_architecture/notebooks"
run_path = "trading_architecture"
launch = "quantfin"

[projects.overrides."Pantry App"]
# Clicking the Pantry node opens the app directly in its own native window.
launch = "pantry"

[library]
# Folders of launchable shortcuts (games, emulators, apps) surfaced as their own
# branches on the ecosystem map. Each top-level .lnk/.url/.exe becomes a node you
# can click to launch. Add or remove roots freely.
#   opens = "gamecenter" / "emucenter" / "moviecenter"  makes the root a single
#   node that opens that Center app (see [connectors]) instead of expanding to
#   raw shortcuts.
roots = [
    { name = "PC Games", path = 'D:\PC Games', opens = "gamecenter" },
    { name = "Emulators", path = 'D:\Emulators', opens = "emucenter" },
    { name = "Movies & Shows", path = 'F:\Movies', opens = "moviecenter" },
]

[server]
host = "127.0.0.1"
port = 7717
open_browser = true
poll_seconds = 20

[connectors]
# Extra CLIs JARVIS should watch for and report on, beyond the built-ins.
# Built-ins already covered: claude, hermes, openclaw.
watch = ["claude", "hermes", "openclaw", "git", "gh", "uv", "ruff", "pyright", "pandoc", "rg"]
# Path to your Hermes skills repo. JARVIS enumerates skills (folders with SKILL.md),
# reports the git branch, and lights up the connector. Leave blank to rely on a
# `hermes` CLI on PATH or a hermes-named folder in PythonProjects.
hermes_path = 'C:\Users\markj\source\repos\hermes-skills'
# The Hermes open-LLM chat app (separate FastAPI server). JARVIS probes this URL
# for status/providers and shows a panel. Path is auto-found under the project
# roots (a "Hermes" folder); set it explicitly here to override.
hermes_chat_url = "http://127.0.0.1:7718"
# hermes_chat_path = 'C:\Users\markj\Documents\PythonProjects\Hermes'
# Game Center / Emu Center / Movie Center — standalone library launcher apps. A
# [library] root flagged `opens = "gamecenter"`, `"emucenter"` or `"moviecenter"`
# launches the matching app (its own server + window) when clicked on the
# ecosystem map. Folders are auto-found ("GameCenter" / "EmuCenter" /
# "MovieCenter" under a project root); set explicitly here to override.
# gamecenter_path = 'C:\Users\markj\Documents\PythonProjects\GameCenter'
# emucenter_path = 'C:\Users\markj\Documents\PythonProjects\EmuCenter'
# moviecenter_path = 'C:\Users\markj\Documents\PythonProjects\MovieCenter'

[rag]
# Vault memory: local RAG over your notes. Markdown from `roots` is chunked and
# embedded through LM Studio's /v1/embeddings (download an embedding model such
# as text-embedding-nomic-embed-text-v1.5, start the server, click "vault" in
# the HUD to index). The JARVIS brain and Hermes' vault toggle both retrieve
# from it. Defaults for roots: the Obsidian vault above + Documents\Delivery Vaults.
enabled = true
embed_base_url = "http://127.0.0.1:1234/v1"
embed_model = "text-embedding-nomic-embed-text-v1.5"
# roots = ['C:\Users\markj\Documents\Obsidian Vault', 'C:\Users\markj\Documents\Delivery Vaults']
top_k = 6
brain_context = true
brain_k = 4
# Office/PDF documents under doc_roots are converted with your local markitdown
# and indexed under their original paths (defaults: PythonProjects + Delivery
# Vaults; conversions cached, so unchanged files cost nothing on reindex).
# doc_roots = ['C:\Users\markj\Documents\PythonProjects', 'C:\Users\markj\Documents\Delivery Vaults']
# doc_exts = [".docx", ".pdf", ".pptx", ".xlsx"]
# markitdown = 'C:\Users\markj\markitdown\.venv\Scripts\markitdown.exe'
