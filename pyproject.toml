[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - personal command center for Mark's dev toolchain, connectors, and Obsidian"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "edge-tts>=7.0",
    "anthropic>=0.40",
    "psutil>=5.9",
    "httpx>=0.27",
    "numpy>=2.4.6",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"
